apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reactweb-processing
  namespace: reactweb
spec:
  targetNamespace: reactweb-staging
  values:
    controllers:
      main:
        replicas: 1
        containers:
          main:
            resources:
              requests:
                cpu: 20m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
