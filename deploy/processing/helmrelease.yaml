apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reactweb-processing
  namespace: reactweb
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "3.7.2"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
  rollback:
    recreate: true
    force: true
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/phenomite/reactweb-backend
              tag: latest
            command:
              - bun
              - scripts/k8s-telemetry-generator.ts
            env:
              NODE_ENV: production
              BACKEND_URL: http://reactweb-database:3001
              UPDATE_INTERVAL_MS: "60000"
              HEALTH_FILE: /tmp/healthy
            securityContext:
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - cat
                      - /tmp/healthy
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
